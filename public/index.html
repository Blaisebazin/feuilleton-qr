<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16140f" />
  <title>Le Feuilleton</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-title" id="site-title">&nbsp;</div>
  </header>

  <main class="scroll-area" id="scroll-area">
    <button class="synopsis-toggle" id="synopsis-toggle" hidden>Synopsis <span class="chev">⌄</span></button>
    <p class="site-synopsis" id="site-synopsis" hidden></p>

    <div class="chapter-block">
      <p class="chapter-eyebrow" id="chapter-eyebrow">&nbsp;</p>
      <h1 class="chapter-title" id="chapter-title">Chargement…</h1>
      <div id="chapter-content"></div>
      <div class="chapter-meta">
        <span class="view-count" id="view-count"></span>
        <button class="like-btn" id="like-chapter-btn">
          <span class="like-icon">👍</span> J'aime ce chapitre <span id="chapter-like-count">0</span>
        </button>
      </div>
    </div>

    <div class="below-page">
      <p class="archive-badge" id="archive-badge" hidden></p>
      <div class="link-row">
        <button id="btn-previous-chapter">↞ Chapitre précédent</button>
        <button id="btn-history">Tous les chapitres</button>
        <button id="btn-latest" hidden>Revenir au dernier ↠</button>
      </div>
      <div class="link-row">
        <button id="btn-share">✉ Inviter un lecteur</button>
      </div>
      <button class="like-btn book-like" id="like-book-btn">
        <span class="like-icon">👍</span> J'aime ce livre <span id="book-like-count">0</span>
      </button>
    </div>

    <div class="scroll-hint" id="scroll-hint">faire défiler pour lire la suite ↓</div>
  </main>

  <div class="toast" id="toast"></div>

  <div class="history-overlay" id="history-overlay">
    <div class="history-sheet">
      <h2>Chapitres publiés</h2>
      <div class="history-list" id="history-list"></div>
      <button class="history-close" id="history-close">Fermer</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
