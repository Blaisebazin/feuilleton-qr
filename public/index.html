<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16140f" />
  <title>Le Feuilleton</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="stage">
    <header class="site-title" id="site-title">&nbsp;</header>
    <p class="site-synopsis" id="site-synopsis" hidden></p>
    <div class="page" id="page">
      <div class="postmark" id="postmark">— · —</div>
      <div class="page-header">
        <p class="chapter-eyebrow" id="chapter-eyebrow">&nbsp;</p>
        <h1 class="chapter-title" id="chapter-title">Chargement…</h1>
      </div>
      <div class="chapter-image" id="chapter-image" hidden>
        <img id="chapter-image-el" alt="" />
      </div>
      <div class="page-body">
        <div class="measurer" id="measurer"></div>
        <div class="page-content" id="page-content"></div>
      </div>
      <div class="page-footer">
        <button class="nav-arrow prev" id="prev-page" aria-label="Page précédente" disabled>‹</button>
        <div class="page-dots" id="page-dots"></div>
        <button class="nav-arrow" id="next-page" aria-label="Page suivante">›</button>
      </div>
    </div>

    <div class="below-page">
      <p class="archive-badge" id="archive-badge" hidden></p>
      <div class="link-row">
        <button id="btn-previous-chapter">↞ Chapitre précédent</button>
        <button id="btn-history">Tous les chapitres</button>
        <button id="btn-latest" hidden>Revenir au dernier ↠</button>
      </div>
      <div class="link-row">
        <button id="btn-share">✉ Inviter un lecteur</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="history-overlay" id="history-overlay">
    <div class="history-sheet">
      <h2>Chapitres publiés</h2>
      <div class="history-list" id="history-list"></div>
      <button class="history-close" id="history-close">Fermer</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
